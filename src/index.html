<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bravura AI — VM Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="images/BravuraLogo.png" alt="Bravura AI">
      <h1>VM Dashboard</h1>
    </div>
    <div class="header-right">
      <span id="user-info"></span>
      <button id="login-btn" onclick="login()">Sign In</button>
      <button id="logout-btn" onclick="logout()" style="display:none">Sign Out</button>
    </div>
  </header>

  <!-- Sign-in banner for embedded mode (shown when not authenticated) -->
  <div id="auth-banner" class="auth-banner" style="display:none">
    <span>Sign in to start, stop, and manage VMs</span>
    <button class="btn-sign-in" onclick="login()">Sign In</button>
  </div>

  <main>
    <div class="toolbar">
      <span id="last-refresh">Loading...</span>
      <button onclick="refreshAll()">Refresh Now</button>
    </div>
    <div id="vm-grid" class="vm-grid">
      <p class="login-prompt">Please sign in to view VM status.</p>
    </div>
  </main>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="modal" style="display:none">
    <div class="modal-content">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-yes" class="btn-danger">Confirm</button>
        <button onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Extend shutdown modal -->
  <div id="extend-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Extend Shutdown</h3>
      <p id="extend-vm-name"></p>
      <div class="extend-options">
        <button onclick="doExtend(1)">+1 hour</button>
        <button onclick="doExtend(2)">+2 hours</button>
        <button onclick="doExtend(4)">+4 hours</button>
      </div>
      <div class="extend-custom">
        <input type="number" id="custom-minutes" placeholder="Minutes (15-720)" min="15" max="720">
        <button onclick="doExtendCustom()">Extend</button>
      </div>
      <div class="modal-actions">
        <button onclick="closeExtendModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
